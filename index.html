const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},key,ub(D.ct));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
const K='gojeong-pw';
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
 document.getElementById('err').textContent='여는 중...';
 try{await open_(pw);try{if(document.getElementById('rm')?.checked!==false)localStorage.setItem(K,pw)}catch(_){}}
 catch(_){document.getElementById('err').textContent='비밀번호가 맞지 않아요.';}};
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){} if(s){try{await open_(s)}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script></body></html>
